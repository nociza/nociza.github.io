      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#eadfce"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8b735f" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
