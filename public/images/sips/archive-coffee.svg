    <path d="M25 600h720" stroke-width="18"/>
  </g>
  <g fill="#3f352d">
    <text x="975" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" letter-spacing="12">SIPLOGUE</text>
    <text x="970" y="665" font-family="Georgia, Times New Roman, serif" font-size="112" font-weight="700">Coffee</text>
    <text x="975" y="740" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" letter-spacing="9" fill="#b65327">ARCHIVE RECORD</text>
