  <circle cx="1270" cy="170" r="330" fill="#d66f32" opacity=".11"/>
  <circle cx="210" cy="790" r="290" fill="#687c63" opacity=".1"/>
  <g transform="translate(190 190)" fill="none" stroke="#3f352d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 215h390v155c0 108-87 195-195 195S95 478 95 370V215Z" stroke-width="25"/>
