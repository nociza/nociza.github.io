<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Coffee archive entry</title>
  <desc id="description">An abstract cream and rust archive card with a line drawing of a coffee cup.</desc>
  <defs>
